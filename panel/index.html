<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tunnels</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      background: transparent;
      color: var(--oc-fg, inherit);
      font: 0.875rem/1.45 var(--oc-font, system-ui, -apple-system, sans-serif);
    }
    #root {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 12px 14px 24px;
      min-height: 100%;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: auto;
    }
    .status-strip {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .account-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border: 0;
      border-radius: 9999px;
      background: color-mix(in srgb, var(--oc-fg, currentColor) 4%, transparent);
      color: var(--oc-fg, inherit);
      font: inherit;
      font-size: 0.75rem;
      line-height: 1.3;
      cursor: pointer;
      transition: background 140ms ease-out;
    }
    .account-pill:hover {
      background: var(--oc-hover, color-mix(in srgb, var(--oc-fg, currentColor) 8%, transparent));
    }
    .account-pill:focus-visible {
      outline: none;
      background: var(--oc-hover, color-mix(in srgb, var(--oc-fg, currentColor) 10%, transparent));
    }
    .account-pill-label {
      color: var(--oc-muted, inherit);
      font-weight: 500;
    }
    .account-pill-value {
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 160px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 9999px;
      flex: none;
      background: var(--oc-muted, currentColor);
    }
    .dot[data-tone="success"] { background: var(--oc-success, #22c55e); }
    .dot[data-tone="info"] { background: var(--oc-info, #3b82f6); }
    .dot[data-tone="warning"] { background: var(--oc-warning, #eab308); }
    .dot[data-tone="error"] { background: var(--oc-error, #ef4444); }
    .stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px;
      border-radius: var(--oc-radius, 9px);
      background: color-mix(in srgb, var(--oc-fg, currentColor) 4%, transparent);
      min-width: 0;
    }
    .card.is-selected {
      background: color-mix(in srgb, var(--oc-fg, currentColor) 6%, transparent);
    }
    .tunnel-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .tunnel-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      flex: 1 1 auto;
    }
    .tunnel-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 0;
    }
    .tunnel-name {
      font-size: 0.875rem;
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    .port-chip {
      display: inline-flex;
      align-items: center;
      padding: 1px 6px;
      border-radius: 5px;
      background: color-mix(in srgb, var(--oc-primary, currentColor) 13%, transparent);
      color: var(--oc-primary-text, var(--oc-primary, inherit));
      font-family: var(--oc-mono, monospace);
      font-size: 0.75rem;
      font-weight: 600;
      line-height: 1.35;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: calc(24rem / 14);
      height: calc(24rem / 14);
      padding: 0;
      border: 1px solid transparent;
      border-radius: calc(var(--oc-radius, 9px) - 4px);
      background: transparent;
      color: var(--oc-muted, inherit);
      cursor: pointer;
      transition: background 140ms ease-out, color 140ms ease-out;
    }
    .icon-btn:hover:not(:disabled) {
      background: color-mix(in srgb, var(--oc-error, #ef4444) 11%, transparent);
      color: var(--oc-error-text, var(--oc-error, #ef4444));
    }
    .icon-btn:focus-visible {
      outline: none;
      background: var(--oc-hover, color-mix(in srgb, var(--oc-fg, currentColor) 8%, transparent));
    }
    .icon-btn:disabled {
      opacity: 0.45;
      pointer-events: none;
    }
    @media (pointer: coarse) {
      .icon-btn {
        width: calc(36rem / 14);
        height: calc(36rem / 14);
      }
    }
    .tunnel-meta {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
      font-size: 0.75rem;
      color: var(--oc-muted, inherit);
      font-variant-numeric: tabular-nums;
    }
    .meta-warn {
      color: var(--oc-warning-text, var(--oc-warning, inherit));
      font-weight: 500;
    }
    .url-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 10px;
      border-radius: calc(var(--oc-radius, 9px) - 3px);
      background: color-mix(in srgb, var(--oc-bg, transparent) 72%, color-mix(in srgb, var(--oc-fg, currentColor) 4%, transparent));
      min-width: 0;
    }
    .url-link {
      flex: 1 1 auto;
      min-width: 0;
      padding: 0;
      border: 0;
      background: none;
      color: var(--oc-primary-text, var(--oc-primary, inherit));
      font-family: var(--oc-mono, monospace);
      font-size: 0.75rem;
      text-align: left;
      overflow-wrap: anywhere;
      text-decoration: underline;
      text-underline-offset: 2px;
      cursor: pointer;
    }
    .url-link:hover {
      opacity: 0.85;
    }
    .tunnel-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .confirm-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px 12px;
      border-radius: calc(var(--oc-radius, 9px) - 3px);
      background: color-mix(in srgb, var(--oc-warning, #eab308) 12%, transparent);
      font-size: 0.75rem;
    }
    .confirm-strip[data-tone="error"] {
      background: color-mix(in srgb, var(--oc-error, #ef4444) 12%, transparent);
    }
    .confirm-text {
      flex: 1 1 160px;
      color: var(--oc-fg, inherit);
    }
    .tunnel-details {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 12px;
      border-top: 1px solid color-mix(in srgb, var(--oc-border, currentColor) 45%, transparent);
    }
    .log-box {
      margin: 0;
      padding: 10px 12px;
      border-radius: calc(var(--oc-radius, 9px) - 3px);
      background: color-mix(in srgb, var(--oc-bg, #000) 55%, color-mix(in srgb, var(--oc-fg, currentColor) 4%, transparent));
      font-family: var(--oc-mono, monospace);
      font-size: 0.75rem;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-height: 180px;
      overflow: auto;
    }
    .error-note {
      font-size: 0.75rem;
      color: var(--oc-error-text, var(--oc-error, #ef4444));
      overflow-wrap: anywhere;
    }
    .muted {
      color: var(--oc-muted, inherit);
      font-size: 0.75rem;
    }
    .form-head {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .form-title {
      margin: 0;
      font-size: 0.9375rem;
      font-weight: 600;
    }
    .field-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
    }
    @media (max-width: 300px) {
      .field-grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }
    .account-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .account-title {
      font-size: 0.875rem;
      font-weight: 600;
    }
    .account-meta {
      font-size: 0.75rem;
      color: var(--oc-muted, inherit);
      overflow-wrap: anywhere;
    }
    .login-output {
      padding: 12px;
      border-radius: calc(var(--oc-radius, 9px) - 3px);
      background: color-mix(in srgb, var(--oc-bg, #000) 45%, color-mix(in srgb, var(--oc-fg, currentColor) 4%, transparent));
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .login-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .login-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .login-field-label {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--oc-muted, inherit);
    }
    .code-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      border-radius: calc(var(--oc-radius, 9px) - 3px);
      background: color-mix(in srgb, var(--oc-bg, transparent) 72%, color-mix(in srgb, var(--oc-fg, currentColor) 4%, transparent));
    }
    .code-value {
      font-family: var(--oc-mono, monospace);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      font-variant-numeric: tabular-nums;
      color: var(--oc-fg, inherit);
      user-select: all;
      overflow-wrap: anywhere;
    }
    .helper-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.75rem;
      color: var(--oc-muted, inherit);
    }
    .setup-box {
      padding: 12px;
      border-radius: calc(var(--oc-radius, 9px) - 3px);
      background: color-mix(in srgb, var(--oc-bg, #000) 45%, color-mix(in srgb, var(--oc-fg, currentColor) 4%, transparent));
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .setup-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .setup-title {
      font-weight: 600;
      color: var(--oc-fg, inherit);
    }
    .setup-note {
      color: var(--oc-muted, inherit);
      line-height: 1.45;
    }
    .cmd-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 10px;
      border-radius: calc(var(--oc-radius, 9px) - 3px);
      background: color-mix(in srgb, var(--oc-bg, transparent) 72%, color-mix(in srgb, var(--oc-fg, currentColor) 4%, transparent));
      min-width: 0;
    }
    .cmd-text {
      flex: 1 1 auto;
      min-width: 0;
      font-family: var(--oc-mono, monospace);
      font-size: 0.75rem;
      color: var(--oc-fg, inherit);
      user-select: all;
      overflow-wrap: anywhere;
    }
    .os-switch {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 2px;
      border-radius: calc(var(--oc-radius, 9px) - 3px);
      background: color-mix(in srgb, var(--oc-fg, currentColor) 5%, transparent);
    }
    .os-btn {
      border: 0;
      border-radius: calc(var(--oc-radius, 9px) - 5px);
      padding: 2px 8px;
      background: transparent;
      color: var(--oc-muted, inherit);
      font: inherit;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 140ms ease-out, color 140ms ease-out;
    }
    .os-btn:hover {
      color: var(--oc-fg, inherit);
    }
    .os-btn[aria-pressed="true"] {
      background: color-mix(in srgb, var(--oc-bg, transparent) 78%, color-mix(in srgb, var(--oc-fg, currentColor) 10%, transparent));
      color: var(--oc-fg, inherit);
    }
    .cli-warning {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      padding: 8px 10px;
      border-radius: calc(var(--oc-radius, 9px) - 3px);
      background: color-mix(in srgb, var(--oc-error, #ef4444) 10%, transparent);
      font-size: 0.75rem;
      color: var(--oc-fg, inherit);
    }
  </style>
</head>
<body>
  <main id="root"></main>
  <script src="./main.js"></script>
</body>
</html>
